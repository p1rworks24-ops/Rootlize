# Capixe — Issue template chooser
#
# blank_issues_enabled: false → users must pick Bug Report or Feature Request
# (no empty / free-form issue from the New issue screen).
#
# Labels used by the forms:
#   - bug          (Bug Report)
#   - enhancement  (Feature Request)
# If these labels do not exist yet:
#   1. Open the repository on GitHub
#   2. Go to Issues → Labels (or Settings → General → Issues)
#   3. Create labels named exactly "bug" and "enhancement"
# Missing labels do not break the forms; GitHub may skip applying them
# until the labels exist.
blank_issues_enabled: false
